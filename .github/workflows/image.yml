name: Image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Check the scripts
        run: |
          bash -n rootfs/usr/local/bin/entrypoint.sh
          bash -n rootfs/usr/local/bin/agent-run
          bash -n rootfs/usr/local/bin/agent-exec
          bash -n rootfs/usr/local/bin/agent-scheduler
          bash -n rootfs/usr/local/bin/agent-ask
          sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck --exclude=SC1091 rootfs/usr/local/bin/*
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: agent:test
          build-args: IMAGE_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --rm --entrypoint bash agent:test -c '
            set -e
            claude --version
            python3 --version
            python3 -c "import requests, yaml"
            test "$(id -u)" = 0
          '
          mkdir -p smoke/config smoke/data
          echo '5 3 * * * /usr/local/bin/agent-run' > smoke/data/crontab
          docker run -d --name smoke -e AGENT_INTERVAL=3600 \
            -v "$PWD/smoke/config:/agent/config:ro" -v "$PWD/smoke/data:/agent/data" agent:test
          sleep 10
          docker logs smoke
          if docker exec smoke crontab -l | grep -q agent-run; then exit 1; fi
          docker exec smoke git -C /agent/data/scripts status --short
          docker exec smoke git -C /agent/data/inbox status --short
          docker exec smoke grep -q "image ${{ github.sha }}" /agent/data/logs/agent.log
          docker exec smoke grep -q 'a run every 3600 s' /agent/data/logs/agent.log
          docker exec smoke grep -q 'next run at' /agent/data/logs/agent.log
          docker exec smoke test -x /agent/data/venv/bin/python
          docker exec smoke grep -q 'bible.md is missing or empty' /agent/data/logs/agent.log
          docker rm -f smoke
      - name: Push
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: IMAGE_VERSION=${{ github.sha }}
          cache-from: type=gha
